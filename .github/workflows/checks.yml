name: Checks

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    paths-ignore:
      - '**.md'
      - '**.png'

  pull_request:


jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # requires-python is ">=3.12", so check every supported version, and
      # report each version even when another one fails
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-python: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Pre-commit on all files
        run: uv run pre-commit run --all-files
